<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-nav {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: slideDown 0.6s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-nav h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-nav a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            transition: width 0.3s ease;
        }

        .header-nav a:hover {
            color: #667eea;
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        .section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .section-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
            letter-spacing: -0.5px;
        }

        .my-team-section {
            background: linear-gradient(135deg, rgba(81, 207, 102, 0.1) 0%, rgba(51, 207, 102, 0.05) 100%);
            padding: 2.5rem;
            border-radius: 15px;
            border: 2px solid #51cf66;
        }

        .my-team-title {
            color: #51cf66;
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-card {
            background: rgba(102, 126, 234, 0.08);
            padding: 2rem;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .team-card:hover {
            background: rgba(102, 126, 234, 0.15);
            transform: translateX(8px);
        }

        .team-card.my-team {
            border-left-color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            margin-bottom: 0;
        }

        .team-card.my-team:hover {
            background: rgba(81, 207, 102, 0.18);
        }

        .team-info {
            min-width: 0;
        }

        .team-info h3 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .team-info p {
            color: #a0a0b0;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            overflow-wrap: anywhere;
        }

        .team-creator {
            color: #00d9ff;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .team-meta {
            color: #a0a0b0;
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        .team-members {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .membres-liste {
            margin-top: 1.2rem;
        }
        
        .membres-liste h4, .team-edit h4 {
            color: #51cf66;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
        }
        
        .membre-ligne {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .membre-ligne:last-child { border-bottom: none; }
        .membre-nom { flex: 1; font-weight: 700; color: #e0e0e0; overflow-wrap: anywhere; min-width: 120px; }
        .membre-role { color: #ffd700; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .membre-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        
        .btn-mini {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.12);
            color: #e0e0e0;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-mini:hover { border-color: #00d9ff; color: #00d9ff; }
        .btn-mini.rouge { border-color: rgba(255, 107, 107, 0.6); background: rgba(255, 107, 107, 0.12); color: #ff8787; }
        .btn-mini.rouge:hover { border-color: #ff6b6b; color: #ff6b6b; }
        
        .team-actions.col {
            flex-direction: column;
            align-items: stretch;
        }
        
        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: #e0e0e0;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-ghost:hover { border-color: #ff6b6b; color: #ff6b6b; }
        
        .team-edit {
            display: none;
            margin-top: 1.2rem;
            padding: 1.2rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.15);
        }
        
        .team-edit.open { display: block; }
        .team-edit .form-group { margin-bottom: 1rem; }
        .team-edit input, .team-edit textarea { padding: 0.9rem; }
        
        .muted { color: #8888a8; font-weight: 600; }
        
        .hors-classement {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            color: #ffd43b;
            font-weight: 700;
        }
        
        .places {
            display: inline-block;
            margin-left: 0.4rem;
            padding: 0.15rem 0.6rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            background: rgba(102, 126, 234, 0.2);
            color: #b8c4ff;
        }
        
        .places.pleine { background: rgba(255, 107, 107, 0.2); color: #ff8787; }
        
        .member-chip {
            background: rgba(81, 207, 102, 0.12);
            border: 1px solid rgba(81, 207, 102, 0.5);
            color: #e0e0e0;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .team-matchs {
            margin-top: 1.5rem;
        }
        
        .team-matchs h4 {
            color: #51cf66;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }
        
        .match-ligne {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        
        .match-ligne:last-child { border-bottom: none; }
        
        .match-res {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        
        .match-res.v { background: rgba(81, 207, 102, 0.2); color: #51cf66; }
        .match-res.d { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .match-score { color: #00d9ff; font-weight: 900; }
        .match-adv { color: #e0e0e0; font-weight: 700; flex: 1; overflow-wrap: anywhere; }
        .match-pts { color: #a0a0b0; font-size: 0.85rem; white-space: nowrap; }
        
        .team-actions {
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        .btn {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.2);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            color: #00d9ff;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            background: rgba(102, 126, 234, 0.05);
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .create-team-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 1.2rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .create-team-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .create-team-btn:hover::before {
            left: 100%;
        }

        .create-team-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .message {
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 700;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(81, 207, 102, 0.15);
            border-left: 5px solid #51cf66;
            color: #51cf66;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.15);
            border-left: 5px solid #ff6b6b;
            color: #ff6b6b;
        }

        .no-teams {
            text-align: center;
            color: #a0a0b0;
            padding: 2rem;
            font-size: 1.1rem;
        }

        @media (max-width: 700px) {
            .section { padding: 1.5rem; }
            .my-team-section { padding: 1.5rem; }
            .team-card { flex-direction: column; align-items: flex-start; padding: 1.5rem; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1>Teams</h1>
            <a href="/">← Retour</a>
        </div>

        <div class="message" id="page-message"></div>

        <div class="section" id="my-team-container" style="display: none;">
            <div class="my-team-section">
                <h2 class="my-team-title">✓ Ma Team</h2>
                <div id="my-team-card"></div>
            </div>
        </div>

        <div class="section" id="create-team-section" style="display: none;">
            <h2 class="section-title">Créer une team</h2>

            <div class="form-group">
                <label for="team-name">Nom de la team</label>
                <input type="text" id="team-name" maxlength="30" placeholder="Ex: Les Legends XHQ">
            </div>

            <div class="form-group">
                <label for="team-bio">Bio (optionnel)</label>
                <textarea id="team-bio" maxlength="300" placeholder="Décrivez votre team..."></textarea>
            </div>

            <button class="create-team-btn" type="button" onclick="createTeam()">Créer la team</button>
        </div>

        <div class="section">
            <h2 class="section-title">Rejoindre une team</h2>

            <div class="search-box">
                <input type="text" class="search-input" id="search-team" placeholder="Rechercher une team...">
            </div>

            <div id="teams-list"></div>
            <div id="no-teams" class="no-teams">Chargement…</div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        let allTeams = [];
        let userTeamId = null;
        let membres = [];
        let mesMatchs = [];
        let maxMembres = 5;

        function showMessage(text, type) {
            const el = document.getElementById('page-message');
            el.textContent = text;
            el.className = 'message show ' + type;
            clearTimeout(showMessage.timer);
            showMessage.timer = setTimeout(() => el.classList.remove('show'), 4000);
        }

        async function loadTeams() {
            const { ok, data } = await api('/api/teams');
            if (!ok || !Array.isArray(data.teams)) {
                document.getElementById('no-teams').textContent = data.error || 'Impossible de charger les teams';
                return;
            }
            allTeams = data.teams;
            userTeamId = data.user_team_id;
            membres = data.membres || [];
            mesMatchs = data.matchs || [];
            maxMembres = data.max_membres || maxMembres;
            document.getElementById('create-team-section').style.display = userTeamId ? 'none' : 'block';
            renderMyTeam();
            renderTeams();
        }

        function renderMyTeam() {
            const container = document.getElementById('my-team-container');
            const myTeam = allTeams.find(t => t.id === userTeamId);
            if (!myTeam) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            const ligue = myTeam.ligue_num
                ? `Ligue ${myTeam.ligue_num} · Poule ${escapeHtml(myTeam.poule || '-')} · ${Number(myTeam.points) || 0} pts`
                : `<span class="hors-classement">⏸ Hors classement : votre team n'a joué aucun match la saison dernière.
                   ${myTeam.is_creator ? `<button class="btn-mini" type="button" onclick="reintegrer(${myTeam.id})">Réintégrer la Ligue 10</button>` : 'Le capitaine peut la réinscrire en Ligue 10.'}</span>`;
            document.getElementById('my-team-card').innerHTML = `
                <div class="team-card my-team">
                    <div class="team-info">
                        <h3>${escapeHtml(myTeam.nom)}</h3>
                        <p>${escapeHtml(myTeam.bio || 'Pas de description')}</p>
                        <div class="team-creator">👑 Capitaine : ${escapeHtml(myTeam.createur)}</div>
                        <div class="team-meta">${ligue}</div>
                        <div class="membres-liste">
                            <h4>Membres <span class="places ${membres.length >= maxMembres ? 'pleine' : ''}">${membres.length}/${maxMembres}</span></h4>
                            ${membres.map(m => `
                                <div class="membre-ligne">
                                    <span class="member-chip">${escapeHtml(m.logo)}</span>
                                    <span class="membre-nom">${escapeHtml(m.username)}${m.is_me ? ' <span class="muted">(vous)</span>' : ''}</span>
                                    ${m.is_capitaine ? '<span class="membre-role">👑 Capitaine</span>' : ''}
                                    ${myTeam.is_creator && !m.is_me ? `
                                        <span class="membre-actions">
                                            <button class="btn-mini" type="button" onclick="nommerCapitaine(${myTeam.id}, ${Number(m.id)})">Nommer capitaine</button>
                                            <button class="btn-mini rouge" type="button" onclick="exclure(${myTeam.id}, ${Number(m.id)})">Exclure</button>
                                        </span>` : ''}
                                </div>`).join('')}
                        </div>
                        ${myTeam.is_creator ? `
                        <div class="team-edit" id="team-edit">
                            <h4>Modifier la team</h4>
                            <div class="form-group">
                                <label for="edit-nom">Nom</label>
                                <input type="text" id="edit-nom" maxlength="30" value="${escapeHtml(myTeam.nom)}">
                            </div>
                            <div class="form-group">
                                <label for="edit-bio">Bio</label>
                                <textarea id="edit-bio" maxlength="300">${escapeHtml(myTeam.bio)}</textarea>
                            </div>
                            <button class="btn btn-primary" type="button" onclick="modifierTeam(${myTeam.id})">Enregistrer</button>
                        </div>` : ''}
                        <div class="team-matchs">
                            <h4>Derniers matchs</h4>
                            ${mesMatchs.length ? mesMatchs.map(m => `
                                <div class="match-ligne">
                                    <span class="match-res ${m.victoire ? 'v' : 'd'}">${m.victoire ? 'V' : 'D'}</span>
                                    <span class="match-score">${Number(m.score_pour)} - ${Number(m.score_contre)}</span>
                                    <span class="match-adv">vs ${escapeHtml(m.adversaire)}</span>
                                    <span class="match-pts">+${Number(m.points_gagnes)} pts</span>
                                </div>`).join('') : '<p>Aucun match joué pour le moment</p>'}
                        </div>
                    </div>
                    <div class="team-actions col">
                        ${myTeam.is_creator ? `
                            <button class="btn btn-primary" type="button" onclick="document.getElementById('team-edit').classList.toggle('open')">Modifier</button>
                            <button class="btn btn-danger" type="button" onclick="deleteTeam(${myTeam.id})">Supprimer</button>` : ''}
                        <button class="btn btn-ghost" type="button" onclick="quitterTeam(${myTeam.id})">Quitter la team</button>
                    </div>
                </div>
            `;
        }

        // Liste des autres teams, filtrée par la recherche
        function renderTeams() {
            const search = document.getElementById('search-team').value.trim().toLowerCase();
            const container = document.getElementById('teams-list');
            const noTeamsDiv = document.getElementById('no-teams');

            const teams = allTeams
                .filter(t => t.id !== userTeamId)
                .filter(t => t.nom.toLowerCase().includes(search));

            if (teams.length === 0) {
                container.innerHTML = '';
                noTeamsDiv.textContent = search ? 'Aucune team ne correspond à votre recherche' : 'Aucune team disponible';
                noTeamsDiv.style.display = 'block';
                return;
            }

            noTeamsDiv.style.display = 'none';
            container.innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-info">
                        <h3>${escapeHtml(team.nom)}</h3>
                        <p>${escapeHtml(team.bio || 'Pas de description')}</p>
                        <div class="team-creator">👑 Capitaine : ${escapeHtml(team.createur)}</div>
                        <div class="team-meta">${Number(team.nb_membres) || 0}/${Number(team.max_membres) || maxMembres} joueurs${team.ligue_num ? ' · Ligue ' + team.ligue_num : ''}</div>
                    </div>
                    <div class="team-actions">
                        ${userTeamId
                            ? '<button class="btn btn-primary" type="button" disabled>Déjà dans une team</button>'
                            : team.pleine
                                ? '<button class="btn btn-primary" type="button" disabled>Complète</button>'
                                : `<button class="btn btn-primary" type="button" onclick="joinTeam(${team.id})">Rejoindre</button>`}
                    </div>
                </div>
            `).join('');
        }

        async function createTeam() {
            const nom = document.getElementById('team-name').value.trim();
            const bio = document.getElementById('team-bio').value.trim();
            if (!nom) {
                showMessage('Le nom de la team est obligatoire', 'error');
                return;
            }
            const { ok, data } = await api('/api/teams', { method: 'POST', body: { nom, bio } });
            if (ok && data.success) {
                document.getElementById('team-name').value = '';
                document.getElementById('team-bio').value = '';
                showMessage('✓ Team créée avec succès ! Elle démarre en Ligue 10.', 'success');
                loadTeams();
            } else {
                showMessage(data.error || 'Erreur lors de la création', 'error');
            }
        }

        async function joinTeam(teamId) {
            const { ok, data } = await api(`/api/teams/${teamId}/join`, { method: 'POST' });
            if (ok && data.success) {
                showMessage('✓ Vous avez rejoint la team !', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }

        async function deleteTeam(teamId) {
            if (!confirm('⚠️ Êtes-vous sûr de vouloir supprimer cette team ?')) return;
            const { ok, data } = await api(`/api/teams/${teamId}/delete`, { method: 'POST' });
            if (ok && data.success) {
                showMessage('✓ Team supprimée', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }

        async function quitterTeam(teamId) {
            const myTeam = allTeams.find(t => t.id === teamId);
            let texte = 'Quitter cette team ?';
            if (myTeam && myTeam.is_creator) {
                texte = membres.length > 1
                    ? 'Vous êtes capitaine : le rôle passera au membre le plus ancien. Quitter la team ?'
                    : 'Vous êtes seul dans la team : elle sera supprimée. Quitter quand même ?';
            }
            if (!confirm(texte)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/leave`, { method: 'POST' });
            if (ok && data.success) {
                showMessage(data.team_supprimee ? '✓ Vous avez quitté la team (elle a été supprimée)' : '✓ Vous avez quitté la team', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }
        
        const nomMembre = userId => (membres.find(m => m.id === userId) || {}).username || 'ce joueur';
        
        async function exclure(teamId, userId) {
            const nom = nomMembre(userId);
            if (!confirm(`Exclure ${nom} de la team ?`)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/kick/${userId}`, { method: 'POST' });
            showMessage(ok && data.success ? `✓ ${nom} a été exclu de la team` : (data.error || 'Erreur'), ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function nommerCapitaine(teamId, userId) {
            const nom = nomMembre(userId);
            if (!confirm(`Nommer ${nom} capitaine ? Vous ne pourrez plus gérer la team.`)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/capitaine/${userId}`, { method: 'POST' });
            showMessage(ok && data.success ? `✓ ${nom} est maintenant capitaine` : (data.error || 'Erreur'), ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function reintegrer(teamId) {
            const { ok, data } = await api(`/api/teams/${teamId}/reintegrer`, { method: 'POST' });
            showMessage(ok && data.success ? `✓ Team réinscrite en Ligue ${data.ligue_num}, poule ${data.poule}` : (data.error || 'Erreur'),
                ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function modifierTeam(teamId) {
            const nom = document.getElementById('edit-nom').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const { ok, data } = await api(`/api/teams/${teamId}/update`, { method: 'POST', body: { nom, bio } });
            if (ok && data.success) {
                showMessage('✓ Team modifiée', 'success');
                loadTeams();
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
        }
        
        document.getElementById('search-team').addEventListener('input', renderTeams);

        loadTeams();
    </script>
</body>
</html>
