<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .my-team-section { border-left: 3px solid var(--win); padding-left: 1.4rem; }
        .my-team-title { color: var(--win); font-size: 1rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1rem; }
        #my-team-container.section { padding: 1.8rem 1.8rem 1.8rem 1.4rem; }

        .team-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--line);
        }

        .team-card:last-child { border-bottom: 0; }
        .team-card.my-team { padding: 0; border: 0; }
        .team-info { min-width: 0; flex: 1; }
        .team-info h3 { font-size: 1.5rem; text-transform: uppercase; overflow-wrap: anywhere; }
        .my-team .team-info h3 { font-size: 2.2rem; font-weight: 800; }
        .team-info > p { color: var(--muted); margin: 0.2rem 0 0.5rem; overflow-wrap: anywhere; }
        .team-creator { color: var(--text); font-size: 0.9rem; }
        .team-meta { color: var(--muted); font-size: 0.88rem; margin-top: 0.2rem; }
        .team-actions { display: flex; gap: 0.6rem; flex-shrink: 0; }
        .team-actions.col { flex-direction: column; align-items: stretch; min-width: 190px; }

        .membres-liste, .team-matchs, .participation, .team-edit { margin-top: 1.4rem; }
        .membres-liste h4, .team-matchs h4, .team-edit h4 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
            color: var(--muted);
            font-family: var(--body);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .places { color: var(--text); }
        .places.pleine { color: var(--lose); }

        .membre-ligne, .match-ligne {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.55rem 0;
            border-bottom: 1px solid var(--line);
        }

        .member-chip {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            background: var(--panel-2);
            border: 2px solid var(--trait);
            border-radius: var(--radius);
        }

        .membre-nom { flex: 1; min-width: 120px; font-weight: 600; overflow-wrap: anywhere; }
        .membre-role { color: var(--gold); font-family: var(--display); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        .membre-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

        .match-res {
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            font-family: var(--display);
            font-weight: 700;
            border-radius: 3px;
        }

        .match-res.v { background: var(--win); color: #fff; }
        .match-res.d { background: var(--lose); color: #fff; }
        .match-score { font-family: var(--display); font-size: 1.15rem; font-weight: 800; }
        .match-adv { flex: 1; overflow-wrap: anywhere; }
        .match-pts { color: var(--muted); font-size: 0.85rem; }
        .team-matchs > p { color: var(--muted); font-size: 0.92rem; }

        .participation { padding: 1rem 1.1rem; background: var(--panel-2); border: 2px solid var(--trait); border-radius: var(--radius); }
        .participation-haut { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; }
        .participation-haut strong { font-family: var(--display); font-size: 1.2rem; }
        .barre { height: 4px; margin-top: 0.6rem; background: var(--line); overflow: hidden; }
        .barre-remplie { height: 100%; background: var(--warn); }
        .barre-remplie.ok { background: var(--win); }
        .participation-bas { margin-top: 0.6rem; color: var(--muted); font-size: 0.86rem; line-height: 1.5; }
        .participation-bas strong { color: var(--warn); }

        .alerte-penalite {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-left: 3px solid var(--lose);
            background: var(--lose-fond);
            font-size: 0.9rem;
        }

        .hors-classement { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; color: var(--warn); }

        .team-edit { display: none; padding: 1.2rem; background: var(--panel-2); border: 2px solid var(--trait); border-radius: var(--radius); }
        .team-edit.open { display: block; }

        .search-box { margin-bottom: 0.6rem; }

        @media (max-width: 760px) {
            .team-card { flex-direction: column; }
            .team-actions.col { width: 100%; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1><span class="kicker">Effectifs</span>Teams</h1>
            <a href="/">← Retour</a>
        </div>

        <div class="message" id="page-message"></div>

        <div class="section" id="my-team-container" style="display: none;">
            <div class="my-team-section">
                <h2 class="my-team-title">Ma team</h2>
                <div id="my-team-card"></div>
            </div>
        </div>

        <div class="section" id="create-team-section" style="display: none;">
            <h2 class="section-title">Créer une team</h2>

            <div class="form-group">
                <label for="team-name">Nom de la team</label>
                <input type="text" id="team-name" maxlength="30" placeholder="Nom de la team">
            </div>

            <div class="form-group">
                <label for="team-bio">Bio (optionnel)</label>
                <textarea id="team-bio" maxlength="300" placeholder="Votre style de jeu, vos horaires, ce que vous cherchez…"></textarea>
            </div>

            <button class="create-team-btn" type="button" onclick="createTeam()">Créer la team</button>
        </div>

        <div class="section">
            <h2 class="section-title">Rejoindre une team</h2>

            <div class="search-box">
                <input type="text" class="search-input" id="search-team" placeholder="Rechercher une team...">
            </div>

            <div id="teams-list"></div>
            <div id="no-teams" class="no-teams">Chargement…</div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        let allTeams = [];
        let userTeamId = null;
        let membres = [];
        let mesMatchs = [];
        let maxMembres = 5;
        let participation = null, dernierePenalite = null;
        let reglePenalite = { par_match: 1, recidive: 2, max: 15 };

        function showMessage(text, type) {
            const el = document.getElementById('page-message');
            el.textContent = text;
            el.className = 'message show ' + type;
            clearTimeout(showMessage.timer);
            showMessage.timer = setTimeout(() => el.classList.remove('show'), 4000);
        }

        async function loadTeams() {
            const { ok, data } = await api('/api/teams');
            if (!ok || !Array.isArray(data.teams)) {
                document.getElementById('no-teams').textContent = data.error || 'Impossible de charger les teams';
                return;
            }
            allTeams = data.teams;
            userTeamId = data.user_team_id;
            membres = data.membres || [];
            mesMatchs = data.matchs || [];
            maxMembres = data.max_membres || maxMembres;
            participation = data.participation;
            dernierePenalite = data.derniere_penalite;
            reglePenalite = data.regle_penalite || reglePenalite;
            document.getElementById('create-team-section').style.display = userTeamId ? 'none' : 'block';
            renderMyTeam();
            renderTeams();
        }

        function renderMyTeam() {
            const container = document.getElementById('my-team-container');
            const myTeam = allTeams.find(t => t.id === userTeamId);
            if (!myTeam) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            const ligue = myTeam.ligue_num
                ? `Ligue ${myTeam.ligue_num} · Poule ${escapeHtml(myTeam.poule || '-')} · ${Number(myTeam.points) || 0} pts`
                : `<span class="hors-classement">Hors classement : votre team n'a joué aucun match la saison dernière.
                   ${myTeam.is_creator ? `<button class="btn-mini" type="button" onclick="reintegrer(${myTeam.id})">Réintégrer la Ligue 10</button>` : 'Le capitaine peut la réinscrire en Ligue 10.'}</span>`;
            document.getElementById('my-team-card').innerHTML = `
                <div class="team-card my-team">
                    <div class="team-info">
                        <h3>${escapeHtml(myTeam.nom)}</h3>
                        <p>${escapeHtml(myTeam.bio || 'Pas de description')}</p>
                        <div class="team-creator">Capitaine : ${escapeHtml(myTeam.createur)}</div>
                        <div class="team-meta">${ligue}</div>
                        ${renderParticipation()}
                        <div class="membres-liste">
                            <h4>Membres <span class="places ${membres.length >= maxMembres ? 'pleine' : ''}">${membres.length}/${maxMembres}</span></h4>
                            ${membres.map(m => `
                                <div class="membre-ligne">
                                    <span class="member-chip${m.cadre ? ' cadre-' + m.cadre.replace('cadre_', '') : ''}">${escapeHtml(m.logo)}</span>
                                    <span class="membre-nom">${escapeHtml(m.username)}${m.badge ? ' <span class="badge-joueur">' + escapeHtml(m.badge) + '</span>' : ''}${m.is_me ? ' <span class="muted">(toi)</span>' : ''}</span>
                                    ${m.is_capitaine ? '<span class="membre-role">Capitaine</span>' : ''}
                                    ${myTeam.is_creator && !m.is_me ? `
                                        <span class="membre-actions">
                                            <button class="btn-mini" type="button" onclick="nommerCapitaine(${myTeam.id}, ${Number(m.id)})">Nommer capitaine</button>
                                            <button class="btn-mini rouge" type="button" onclick="exclure(${myTeam.id}, ${Number(m.id)})">Exclure</button>
                                        </span>` : ''}
                                </div>`).join('')}
                        </div>
                        ${myTeam.is_creator ? `
                        <div class="team-edit" id="team-edit">
                            <h4>Modifier la team</h4>
                            <div class="form-group">
                                <label for="edit-nom">Nom</label>
                                <input type="text" id="edit-nom" maxlength="30" value="${escapeHtml(myTeam.nom)}">
                            </div>
                            <div class="form-group">
                                <label for="edit-bio">Bio</label>
                                <textarea id="edit-bio" maxlength="300">${escapeHtml(myTeam.bio)}</textarea>
                            </div>
                            <button class="btn btn-primary" type="button" onclick="modifierTeam(${myTeam.id})">Enregistrer</button>
                        </div>` : ''}
                        <div class="team-matchs">
                            <h4>Derniers matchs</h4>
                            ${mesMatchs.length ? mesMatchs.map(m => `
                                <div class="match-ligne">
                                    <span class="match-res ${m.victoire ? 'v' : 'd'}">${m.victoire ? 'V' : 'D'}</span>
                                    <span class="match-score">${Number(m.score_pour)} - ${Number(m.score_contre)}</span>
                                    <span class="match-adv">vs ${escapeHtml(m.adversaire)}</span>
                                    <span class="match-pts">+${Number(m.points_gagnes)} pts</span>
                                </div>`).join('') : '<p>Aucun match joué pour le moment</p>'}
                        </div>
                    </div>
                    <div class="team-actions col">
                        ${myTeam.is_creator ? `
                            <button class="btn btn-primary" type="button" onclick="document.getElementById('team-edit').classList.toggle('open')">Modifier</button>
                            <button class="btn btn-danger" type="button" onclick="deleteTeam(${myTeam.id})">Supprimer</button>` : ''}
                        <button class="btn btn-ghost" type="button" onclick="quitterTeam(${myTeam.id})">Quitter la team</button>
                    </div>
                </div>
            `;
        }

        function renderParticipation() {
            let html = '';
            if (dernierePenalite) {
                html += `<div class="alerte-penalite">Saison ${Number(dernierePenalite.saison)} : pénalité de
                    <strong>−${Number(dernierePenalite.penalite)} pts</strong> (${Number(dernierePenalite.matchs_manques)} match(s) non joué(s)${dernierePenalite.recidive ? ', récidive ×' + Number(reglePenalite.recidive) : ''}).</div>`;
            }
            if (participation && participation.attendus > 0) {
                const p = participation;
                const ratio = Math.min(100, Math.round(100 * p.joues / p.attendus));
                const parMatch = reglePenalite.par_match * (p.recidive_possible ? reglePenalite.recidive : 1);
                html += `<div class="participation">
                    <div class="participation-haut"><span>Matchs joués cette saison</span><strong>${Number(p.joues)} / ${Number(p.attendus)}</strong></div>
                    <div class="barre"><div class="barre-remplie ${ratio === 100 ? 'ok' : ''}" style="width:${ratio}%"></div></div>
                    <div class="participation-bas">${p.manques > 0
                        ? `Chaque match non joué = <strong>−${parMatch} pt</strong> en fin de saison${p.recidive_possible ? ' (récidive : pénalité doublée)' : ''}, plafond −${Number(reglePenalite.max)}. Aucun match = team retirée du classement.`
                        : 'Tous les matchs sont joués : pas de pénalité.'}</div>
                </div>`;
            }
            return html;
        }
        
        // Liste des autres teams, filtrée par la recherche
        function renderTeams() {
            const search = document.getElementById('search-team').value.trim().toLowerCase();
            const container = document.getElementById('teams-list');
            const noTeamsDiv = document.getElementById('no-teams');

            const teams = allTeams
                .filter(t => t.id !== userTeamId)
                .filter(t => t.nom.toLowerCase().includes(search));

            if (teams.length === 0) {
                container.innerHTML = '';
                noTeamsDiv.textContent = search ? 'Aucune team ne correspond à votre recherche' : 'Aucune team disponible';
                noTeamsDiv.style.display = 'block';
                return;
            }

            noTeamsDiv.style.display = 'none';
            container.innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-info">
                        <h3>${escapeHtml(team.nom)}</h3>
                        <p>${escapeHtml(team.bio || 'Pas de description')}</p>
                        <div class="team-creator">Capitaine : ${escapeHtml(team.createur)}</div>
                        <div class="team-meta">${Number(team.nb_membres) || 0}/${Number(team.max_membres) || maxMembres} joueurs${team.ligue_num ? ' · Ligue ' + team.ligue_num : ''}</div>
                    </div>
                    <div class="team-actions">
                        ${userTeamId
                            ? '<button class="btn btn-primary" type="button" disabled>Déjà dans une team</button>'
                            : team.pleine
                                ? '<button class="btn btn-primary" type="button" disabled>Complète</button>'
                                : `<button class="btn btn-primary" type="button" onclick="joinTeam(${team.id})">Rejoindre</button>`}
                    </div>
                </div>
            `).join('');
        }

        async function createTeam() {
            const nom = document.getElementById('team-name').value.trim();
            const bio = document.getElementById('team-bio').value.trim();
            if (!nom) {
                showMessage('Le nom de la team est obligatoire', 'error');
                return;
            }
            const { ok, data } = await api('/api/teams', { method: 'POST', body: { nom, bio } });
            if (ok && data.success) {
                document.getElementById('team-name').value = '';
                document.getElementById('team-bio').value = '';
                showMessage('Team créée. Elle démarre en Ligue 10.', 'success');
                loadTeams();
            } else {
                showMessage(data.error || 'Erreur lors de la création', 'error');
            }
        }

        async function joinTeam(teamId) {
            const { ok, data } = await api(`/api/teams/${teamId}/join`, { method: 'POST' });
            if (ok && data.success) {
                showMessage('Tu as rejoint la team.', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }

        async function deleteTeam(teamId) {
            if (!confirm('Supprimer cette team ? Ses membres se retrouveront sans team.')) return;
            const { ok, data } = await api(`/api/teams/${teamId}/delete`, { method: 'POST' });
            if (ok && data.success) {
                showMessage('Team supprimée.', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }

        async function quitterTeam(teamId) {
            const myTeam = allTeams.find(t => t.id === teamId);
            let texte = 'Quitter cette team ?';
            if (myTeam && myTeam.is_creator) {
                texte = membres.length > 1
                    ? 'Vous êtes capitaine : le rôle passera au membre le plus ancien. Quitter la team ?'
                    : 'Vous êtes seul dans la team : elle sera supprimée. Quitter quand même ?';
            }
            if (!confirm(texte)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/leave`, { method: 'POST' });
            if (ok && data.success) {
                showMessage(data.team_supprimee ? 'Tu as quitté la team (elle a été supprimée).' : 'Tu as quitté la team.', 'success');
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
            loadTeams();
        }
        
        const nomMembre = userId => (membres.find(m => m.id === userId) || {}).username || 'ce joueur';
        
        async function exclure(teamId, userId) {
            const nom = nomMembre(userId);
            if (!confirm(`Exclure ${nom} de la team ?`)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/kick/${userId}`, { method: 'POST' });
            showMessage(ok && data.success ? `${nom} a été exclu de la team.` : (data.error || 'Erreur'), ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function nommerCapitaine(teamId, userId) {
            const nom = nomMembre(userId);
            if (!confirm(`Nommer ${nom} capitaine ? Vous ne pourrez plus gérer la team.`)) return;
            const { ok, data } = await api(`/api/teams/${teamId}/capitaine/${userId}`, { method: 'POST' });
            showMessage(ok && data.success ? `${nom} est maintenant capitaine.` : (data.error || 'Erreur'), ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function reintegrer(teamId) {
            const { ok, data } = await api(`/api/teams/${teamId}/reintegrer`, { method: 'POST' });
            showMessage(ok && data.success ? `Team réinscrite en Ligue ${data.ligue_num}, poule ${data.poule}.` : (data.error || 'Erreur'),
                ok && data.success ? 'success' : 'error');
            loadTeams();
        }
        
        async function modifierTeam(teamId) {
            const nom = document.getElementById('edit-nom').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const { ok, data } = await api(`/api/teams/${teamId}/update`, { method: 'POST', body: { nom, bio } });
            if (ok && data.success) {
                showMessage('Team modifiée.', 'success');
                loadTeams();
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
        }
        
        document.getElementById('search-team').addEventListener('input', renderTeams);

        loadTeams();
    </script>
</body>
</html>
