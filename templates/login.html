<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .container {
            max-width: 450px;
            width: 100%;
        }
        
        .card {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 4rem 2.5rem;
            border-radius: 25px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { 
                transform: translateY(50px);
                opacity: 0;
            }
            to { 
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin: 0;
        }
        
        h2 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0 0 0.5rem;
            text-align: center;
        }
        
        .subtitle {
            color: #a0a0b0;
            font-size: 0.95rem;
            text-align: center;
            margin: 0 0 2.5rem;
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.8rem;
            color: #00d9ff;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            background: rgba(102, 126, 234, 0.05);
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: #666;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }
        
        .btn {
            width: 100%;
            padding: 1.3rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 2rem;
            color: #a0a0b0;
            font-size: 0.95rem;
        }
        
        .footer-text a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 800;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .footer-text a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            transition: width 0.3s ease;
        }
        
        .footer-text a:hover {
            color: #667eea;
        }
        
        .footer-text a:hover::after {
            width: 100%;
        }
        
        .forgot {
            text-align: right;
            margin: -1.2rem 0 2rem;
            font-size: 0.9rem;
        }
        
        .forgot a {
            color: #a0a0b0;
            text-decoration: none;
            font-weight: 600;
        }
        
        .forgot a:hover {
            color: #00d9ff;
        }
        
        .error-message {
            background: rgba(255, 107, 107, 0.15);
            border-left: 5px solid #ff6b6b;
            padding: 1.2rem;
            border-radius: 10px;
            color: #ff6b6b;
            margin-bottom: 2rem;
            display: none;
            font-weight: 700;
        }
        
        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 500px) {
            .card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main center">
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>XHQ</h1>
            </div>
            
            <h2>Connexion</h2>
            <p class="subtitle">Accédez à votre compte XHQ Tournament</p>
            
            <div class="error-message" id="error-message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="forgot">
                    <a href="/contact?sujet=Mot%20de%20passe%20oubli%C3%A9">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn">Se connecter</button>
            </form>
            
            <div class="footer-text">
                Pas encore de compte ? <a href="/signup">S'inscrire</a>
            </div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const body = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };
            const errorMsg = document.getElementById('error-message');
            const btn = e.target.querySelector('button[type=submit]');
            errorMsg.classList.remove('show');
            btn.disabled = true;
            
            const { ok, data } = await api('/api/login', { method: 'POST', body, noRedirect: true });
            
            if (ok && data.success) {
                window.location.href = '/';
                return;
            }
            btn.disabled = false;
            errorMsg.textContent = data.error || 'Erreur de connexion';
            errorMsg.classList.add('show');
        });
    </script>
</body>
</html>
