<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - XHQ League</title>
    {% include '_head.html' %}
    <style>
        .header-right { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .solde-display { color: var(--muted); font-size: 0.95rem; }
        .solde-display strong { color: var(--text); font-size: 1.2rem; }

        .intro { max-width: 640px; color: var(--muted); margin: -0.6rem 0 2rem; line-height: 1.6; }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: 1rem;
        }

        .item-card {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .item-card.possede .item-image { background: var(--win-fond); }

        .item-image {
            height: 150px;
            display: grid;
            place-items: center;
            background: var(--bg-2);
            border-bottom: 1px solid var(--line);
        }

        /* Aperçus dessinés en CSS, pas d'images génériques */
        .apercu-badge {
            padding: 0.35rem 1rem;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .apercu-badge.saison { background: var(--bg); color: #fff; border-color: var(--line-2); }
        .apercu-badge.champion { background: transparent; color: #fff; border: 2px solid var(--violet); box-shadow: 0 0 22px rgba(124, 108, 255, 0.45); }

        .apercu-cadre {
            width: 84px;
            height: 84px;
            display: grid;
            place-items: center;
            font-size: 2.6rem;
            background: var(--panel-2);
            border-radius: var(--radius);
        }

        .apercu-avatars { display: flex; gap: 0.5rem; font-size: 2.2rem; }

        .item-content { flex: 1; display: flex; flex-direction: column; padding: 1.2rem 1.3rem 1.3rem; }
        .item-type { color: var(--dim); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; }
        .item-name { margin: 0.2rem 0 0.4rem; font-size: 1.5rem; font-weight: 700; }
        .item-description { flex: 1; color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin-bottom: 1.1rem; }

        .item-footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .item-price { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--win); }
        .item-limite { color: var(--warn); font-size: 0.82rem; }
        .item-btn { padding: 0.6rem 1.1rem; font-size: 0.95rem; }
        
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1><span class="kicker">Objets</span>Shop</h1>
            <div class="header-right">
                <div class="solde-display" id="solde-display">Solde : …</div>
            </div>
        </div>

        <p class="intro">Tout est gratuit et purement visuel : rien ici ne change un résultat ou un classement. Certains objets ne sont disponibles qu'un temps, après ils disparaissent.</p>

        <div class="message" id="shop-message"></div>
        <div id="shop-list" class="shop-grid">
            <div class="empty">Chargement…</div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        const TYPES = { badge: 'Badge', cadre: "Cadre d'avatar", avatars: 'Avatars' };
        const monAvatar = {{ current_user.logo | tojson }};

        function apercu(item) {
            switch (item.code) {
                case 'fondateur': return '<span class="apercu-badge">Fondateur</span>';
                case 'saison1': return '<span class="apercu-badge saison">Saison 1</span>';
                case 'champion_tournoi': return '<span class="apercu-badge champion">Champion</span>';
                case 'cadre_or': return `<span class="apercu-cadre cadre-or">${escapeHtml(monAvatar)}</span>`;
                case 'cadre_carbone': return `<span class="apercu-cadre cadre-carbone">${escapeHtml(monAvatar)}</span>`;
                case 'pack_rare': return '<span class="apercu-avatars">🐉 🦄 🤖 👽</span>';
                default: return '';
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('shop-message');
            el.textContent = text;
            el.className = 'message show ' + type;
            clearTimeout(showMessage.timer);
            showMessage.timer = setTimeout(() => el.classList.remove('show'), 4000);
        }

        async function loadSolde() {
            const { ok, data } = await api('/api/profil');
            if (ok) document.getElementById('solde-display').innerHTML = `Solde : <strong>${Number(data.solde) || 0} €</strong>`;
        }

        async function loadShop() {
            const container = document.getElementById('shop-list');
            const { ok, data } = await api('/api/shop');
            if (!ok || !Array.isArray(data)) {
                container.innerHTML = `<div class="empty">${escapeHtml(data.error || 'Impossible de charger le shop')}</div>`;
                return;
            }
            if (!data.length) {
                container.innerHTML = '<div class="empty">Rien pour le moment.</div>';
                return;
            }
            container.innerHTML = data.map(item => {
                let bouton;
                if (item.possede) bouton = '<button class="item-btn" type="button" disabled>Récupéré</button>';
                else if (!item.disponible) bouton = `<button class="item-btn" type="button" disabled>${escapeHtml(item.raison || 'Indisponible')}</button>`;
                else bouton = `<button class="item-btn" type="button" onclick="recuperer(${Number(item.id)})">Récupérer</button>`;
                const limite = item.code === 'fondateur' && !item.possede && item.disponible
                    ? `<span class="item-limite">${Number(item.places_restantes)} place(s) restante(s)</span>`
                    : (item.code === 'saison1' && item.disponible && !item.possede ? '<span class="item-limite">Saison 1 seulement</span>' : '<span class="item-price">Gratuit</span>');
                return `
                <div class="item-card ${item.possede ? 'possede' : ''}">
                    <div class="item-image">${apercu(item)}</div>
                    <div class="item-content">
                        <div class="item-type">${TYPES[item.type] || escapeHtml(item.type)}</div>
                        <div class="item-name">${escapeHtml(item.nom)}</div>
                        <div class="item-description">${escapeHtml(item.description)}</div>
                        <div class="item-footer">${limite}${bouton}</div>
                    </div>
                </div>`;
            }).join('');
        }

        async function recuperer(itemId) {
            const { ok, data } = await api(`/api/shop/recuperer/${itemId}`, { method: 'POST' });
            if (ok && data.success) {
                showMessage(`${data.item} ajouté à ton inventaire. Tu peux l'équiper depuis ton profil.`, 'success');
                loadShop();
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
        }

        loadSolde();
        loadShop();
    </script>
</body>
</html>
