<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-nav {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: slideDown 0.6s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-nav h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .solde-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 1.2rem 2rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .header-right {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-nav a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            transition: width 0.3s ease;
        }

        .header-nav a:hover {
            color: #667eea;
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        .section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .section h2 {
            color: #fff;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 2.5rem;
        }

        .item-card {
            background: rgba(102, 126, 234, 0.08);
            border-radius: 15px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        .item-card:hover::before {
            top: -30%;
            right: -30%;
        }

        .item-card:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            transform: translateY(-12px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.2);
        }

        .item-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            z-index: 2;
        }

        .item-content {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .item-name {
            color: #00d9ff;
            font-weight: 900;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .item-description {
            color: #a0a0b0;
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
            flex: 1;
            line-height: 1.6;
        }

        .item-type {
            color: #667eea;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .item-price {
            color: #00d9ff;
            font-weight: 900;
            font-size: 1.5rem;
        }

        .item-btn {
            flex: 1;
            padding: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .item-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .item-btn:hover::before {
            left: 100%;
        }

        .item-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .item-btn:disabled {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .message {
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: none;
            font-weight: 700;
        }

        .message.show { display: block; }
        .message.success { background: rgba(81, 207, 102, 0.15); border-left: 5px solid #51cf66; color: #51cf66; }
        .message.error { background: rgba(255, 107, 107, 0.15); border-left: 5px solid #ff6b6b; color: #ff6b6b; }

        .empty {
            text-align: center;
            color: #a0a0b0;
            padding: 3rem 2rem;
            font-size: 1.1rem;
        }

        @media (max-width: 700px) {
            .section { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1>Shop</h1>
            <div class="header-right">
                <div class="solde-display" id="solde-display">Solde : …</div>
                <a href="/">← Retour à l'accueil</a>
            </div>
        </div>

        <div class="section">
            <h2>Items disponibles</h2>
            <div class="message" id="shop-message"></div>
            <div id="shop-list" class="shop-grid">
                <div class="empty">Chargement...</div>
            </div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        const ICONES = { badge: '🏅', cosmetic: '🎨', boost: '⚡' };

        function showMessage(text, type) {
            const el = document.getElementById('shop-message');
            el.textContent = text;
            el.className = 'message show ' + type;
            clearTimeout(showMessage.timer);
            showMessage.timer = setTimeout(() => el.classList.remove('show'), 4000);
        }

        function afficherSolde(solde) {
            document.getElementById('solde-display').textContent = 'Solde : ' + (Number(solde) || 0) + '€';
        }

        async function loadSolde() {
            const { ok, data } = await api('/api/profil');
            if (ok) afficherSolde(data.solde);
        }

        async function loadShop() {
            const container = document.getElementById('shop-list');
            const { ok, data } = await api('/api/shop');
            if (!ok || !Array.isArray(data)) {
                container.innerHTML = `<div class="empty">${escapeHtml(data.error || 'Impossible de charger le shop')}</div>`;
                return;
            }
            if (data.length === 0) {
                container.innerHTML = '<div class="empty">Aucun item disponible</div>';
                return;
            }
            container.innerHTML = data.map((item, i) => {
                const possede = item.unique && item.possede > 0;
                return `
                <div class="item-card" style="animation: fadeInUp 0.8s ease-out ${i * 0.1}s both;">
                    <div class="item-image">${ICONES[item.type] || '🎁'}</div>
                    <div class="item-content">
                        <div class="item-name">${escapeHtml(item.nom)}</div>
                        <div class="item-description">${escapeHtml(item.description)}</div>
                        <div class="item-type">${escapeHtml(item.type)}${item.possede > 0 && !item.unique ? ' · possédé x' + Number(item.possede) : ''}</div>
                        <div class="item-footer">
                            <div class="item-price">${Number(item.prix) || 0}€</div>
                            ${possede
                                ? '<button class="item-btn" type="button" disabled>✓ Possédé</button>'
                                : `<button class="item-btn" type="button" onclick="buyItem(${Number(item.id)})">Acheter</button>`}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function buyItem(itemId) {
            const { ok, data } = await api(`/api/shop/buy/${itemId}`, { method: 'POST' });
            if (ok && data.success) {
                showMessage(`✓ ${data.item} acheté !` + (/Boost/.test(data.item) ? ' Active-le depuis ton profil (section Mon inventaire).' : ''), 'success');
                afficherSolde(data.solde);
                loadShop();
            } else {
                showMessage(data.error || 'Erreur', 'error');
            }
        }

        loadSolde();
        loadShop();
    </script>
</body>
</html>
