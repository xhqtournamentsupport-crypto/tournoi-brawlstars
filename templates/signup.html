<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .container { max-width: 420px; width: 100%; }
        .card { padding: 2.4rem 2rem; }
        .logo { margin-bottom: 2rem; }
        .logo h1 { font-size: 1rem; letter-spacing: 0.25em; color: var(--accent); font-weight: 700; }
        h2 { font-size: 2.6rem; font-weight: 800; text-transform: uppercase; line-height: 1; margin-bottom: 0.5rem; }
        .subtitle { color: var(--muted); margin-bottom: 2rem; }
        .btn { width: 100%; padding: 0.95rem; font-size: 1.1rem; margin-top: 0.3rem; }
        .btn:disabled { cursor: wait; }
        .forgot { text-align: right; margin: -0.6rem 0 1.4rem; font-size: 0.88rem; }
        .forgot a { color: var(--muted); text-decoration: none; }
        .forgot a:hover { color: var(--text); }
        .footer-text { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
        .footer-text a { color: var(--text); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--accent); }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main center">
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>XHQ LEAGUE</h1>
            </div>
            
            <h2>S'inscrire</h2>
            <p class="subtitle">Deux minutes, et tu peux créer ou rejoindre une team.</p>
            
            <div class="error-message" id="error-message"></div>
            
            <form id="signup-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="Votre pseudonyme" autocomplete="username" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="6 caractères minimum" autocomplete="new-password" required minlength="6">
                </div>

                <button type="submit" class="btn">S'inscrire</button>
            </form>
            
            <div class="footer-text">
                Déjà inscrit ? <a href="/login">Se connecter</a>
            </div>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const body = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };
            const errorMsg = document.getElementById('error-message');
            const btn = e.target.querySelector('button[type=submit]');
            errorMsg.classList.remove('show');
            btn.disabled = true;
            
            const { ok, data } = await api('/api/signup', { method: 'POST', body, noRedirect: true });
            
            if (ok && data.success) {
                window.location.href = '/';
                return;
            }
            btn.disabled = false;
            errorMsg.textContent = data.error || 'Erreur d\'inscription';
            errorMsg.classList.add('show');
        });
    </script>
</body>
</html>
