<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Discord · XHQ League</title>
    {% include '_head.html' %}
    <style>
        .redirige { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 1rem; padding: 2rem 1rem; }
        .redirige .rond { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; border: 4px solid rgba(124, 108, 255, .25); border-top-color: var(--accent); animation: tourne .8s linear infinite; }
        @keyframes tourne { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main class="redirige">
        <div class="rond" aria-hidden="true"></div>
        <h1>Direction le Discord XHQ</h1>
        <p class="muted">Si rien ne se passe, <a id="lien" href="{{ secours }}">clique ici</a></p>
    </main>
    <script>
    (function () {
        var secours = {{ secours | tojson }}, fini = false;
        var aller = function (url) { if (fini) return; fini = true; document.getElementById('lien').href = url; location.replace(url); };
        setTimeout(function () { aller(secours); }, 5000);
        fetch('https://discord.com/api/guilds/' + {{ serveur | tojson }} + '/widget.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                var lien = d && d.instant_invite;
                aller(typeof lien === 'string' && /^https:\/\/discord\.(com\/invite|gg)\/[A-Za-z0-9-]{2,32}$/.test(lien) ? lien : secours);
            })
            .catch(function () { aller(secours); });
    })();
    </script>
</body>
</html>
