<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligue - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-nav {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: slideDown 0.6s ease-out;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-nav h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-nav a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            transition: width 0.3s ease;
        }

        .header-nav a:hover {
            color: #667eea;
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        .selector-wrapper {
            position: relative;
            margin-bottom: 3rem;
            width: fit-content;
            animation: fadeInUp 0.8s ease-out 0.1s both;
            z-index: 100;
        }

        .selector-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 1.1rem 2.5rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .selector-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .dropdown-arrow {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }

        .dropdown-arrow.open {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 0.8rem);
            left: 0;
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.99) 0%, rgba(50, 50, 80, 0.95) 100%);
            border-radius: 15px;
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.25);
            border: 2px solid rgba(102, 126, 234, 0.3);
            display: none;
            flex-direction: column;
            gap: 0.8rem;
            padding: 1.5rem;
            min-width: 220px;
            z-index: 1001;
            animation: slideDown 0.3s ease-out;
            backdrop-filter: blur(10px);
        }

        .dropdown-menu.open {
            display: flex;
        }

        .dropdown-item {
            padding: 1rem 1.3rem;
            background: rgba(102, 126, 234, 0.1);
            color: #00d9ff;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.95rem;
            font-family: inherit;
            text-align: left;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dropdown-item:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            transform: translateX(5px);
        }

        .dropdown-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: #fff;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .ligue-section {
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .ligue-title {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
            background: linear-gradient(135deg, #667eea 0%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .poules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(450px, 100%), 1fr));
            gap: 2.5rem;
        }

        .poule {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.95) 0%, rgba(50, 50, 80, 0.85) 100%);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .poule-title {
            color: #00d9ff;
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .leaderboard {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            padding: 1.3rem;
            background: rgba(102, 126, 234, 0.08);
            border-radius: 12px;
            margin-bottom: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #667eea;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .leaderboard-item:hover {
            background: rgba(102, 126, 234, 0.15);
            transform: translateX(8px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .leaderboard-item.monte {
            border-left-color: #51cf66;
            background: rgba(81, 207, 102, 0.08);
        }

        .leaderboard-item.monte:hover {
            background: rgba(81, 207, 102, 0.15);
        }

        .leaderboard-item.descend {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
        }

        .leaderboard-item.descend:hover {
            background: rgba(255, 107, 107, 0.15);
        }

        .leaderboard-item.champion {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        .leaderboard-item.champion:hover {
            background: rgba(255, 215, 0, 0.15);
        }

        .leaderboard-item.vide .player-name,
        .leaderboard-item.vide .player-points {
            color: #5c5c75;
        }

        .rank {
            font-size: 1.4rem;
            font-weight: 900;
            color: #667eea;
            min-width: 50px;
            text-align: center;
        }

        .rank.top1 {
            color: #ffd700;
            font-size: 1.6rem;
        }

        .rank.top2 {
            color: #c0c0c0;
            font-size: 1.5rem;
        }

        .rank.top3 {
            color: #cd7f32;
            font-size: 1.5rem;
        }

        .player-info {
            flex: 1;
            margin: 0 1.5rem;
            min-width: 0;
        }

        .player-name {
            color: #fff;
            font-weight: 800;
            font-size: 1.05rem;
            overflow-wrap: anywhere;
        }

        .player-stats {
            color: #8888a8;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.3rem;
            letter-spacing: 0.3px;
        }
        
        .resultats {
            margin-top: 3rem;
        }
        
        .resultats h3 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
        }
        
        .resultat {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.3rem;
            margin-bottom: 0.7rem;
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
        }
        
        .resultat .equipe { font-weight: 800; color: #e0e0e0; overflow-wrap: anywhere; }
        .resultat .equipe.gagnant { color: #51cf66; }
        .resultat .equipe:first-child { text-align: right; }
        .resultat .equipe:nth-child(3) { text-align: left; }
        .resultat .score { color: #00d9ff; font-weight: 900; font-size: 1.2rem; white-space: nowrap; }
        .resultat .poule-tag { color: #8888a8; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
        
        .player-points {
            color: #00d9ff;
            font-weight: 900;
            font-size: 1.2rem;
            min-width: 70px;
            text-align: right;
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 0.8rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .badge.monte {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
            border: 1px solid #51cf66;
        }

        .badge.descend {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .badge.champion {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        .ligue-message {
            color: #a0a0b0;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .resultat { grid-template-columns: 1fr auto 1fr; }
            .resultat .poule-tag { grid-column: 1 / -1; text-align: center; }
            .poule { padding: 1.5rem 1rem; }
            .leaderboard-item { padding: 1rem 0.8rem; flex-wrap: wrap; }
            .player-info { margin: 0 0.8rem; }
            .badge { margin-left: 0; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1>Classement Ligue</h1>
            <a href="/">← Retour à l'accueil</a>
        </div>

        <div class="selector-wrapper">
            <button class="selector-btn" type="button" onclick="toggleDropdown()" aria-haspopup="true">
                <span id="selector-label">Ligue 1</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu" id="dropdown-menu">
                {% for n in range(1, 11) %}
                <button class="dropdown-item{% if n == 1 %} active{% endif %}" type="button" data-ligue="{{ n }}" onclick="selectLigue({{ n }})">Ligue {{ n }}</button>
                {% endfor %}
            </div>
        </div>

        <div class="ligue-section" id="ligue-content">
            <p class="ligue-message">Chargement du classement…</p>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        const BADGES = {
            champion: '<span class="badge champion">★ CHAMPION</span>',
            monte: '<span class="badge monte">↑ MONTE</span>',
            descend: '<span class="badge descend">↓ DESCEND</span>'
        };

        let currentLigue = 1;
        let derniereRequete = 0;

        function toggleDropdown() {
            document.getElementById('dropdown-menu').classList.toggle('open');
            document.querySelector('.dropdown-arrow').classList.toggle('open');
        }

        function closeDropdown() {
            document.getElementById('dropdown-menu').classList.remove('open');
            document.querySelector('.dropdown-arrow').classList.remove('open');
        }

        function selectLigue(ligue) {
            currentLigue = ligue;
            closeDropdown();
            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.classList.toggle('active', Number(item.dataset.ligue) === ligue);
            });
            document.getElementById('selector-label').textContent = 'Ligue ' + ligue;
            loadLigue(ligue);
        }

        function renderItem(place) {
            const rang = place.rang;
            let rankClass = '';
            if (rang === 1) rankClass = 'top1';
            else if (rang === 2) rankClass = 'top2';
            else if (rang === 3) rankClass = 'top3';

            const vide = !place.team_id;
            const statut = vide ? '' : (place.statut || '');
            const nom = vide ? 'XXXXX' : escapeHtml(place.team_name);

            return `
                <li class="leaderboard-item ${statut} ${vide ? 'vide' : ''}">
                    <span class="rank ${rankClass}">#${rang}</span>
                    <div class="player-info">
                        <div class="player-name">${nom}</div>
                        ${vide ? '' : `<div class="player-stats">J ${place.joues} · V ${place.victoires} · D ${place.defaites} · ${place.diff > 0 ? '+' : ''}${place.diff}</div>`}
                    </div>
                    <div class="player-points">${vide ? 0 : Number(place.points) || 0} pts</div>
                    ${BADGES[statut] || ''}
                </li>
            `;
        }

        // N'affiche QUE les teams renvoyées par l'API pour cette ligue
        function renderResultats(matchs) {
            if (!matchs.length) {
                return '<div class="resultats"><h3>Derniers résultats</h3><p class="ligue-message">Aucun match joué dans cette ligue pour le moment</p></div>';
            }
            return '<div class="resultats"><h3>Derniers résultats</h3>' + matchs.map(m => `
                <div class="resultat">
                    <span class="equipe ${m.score1 > m.score2 ? 'gagnant' : ''}">${escapeHtml(m.team1_nom)}</span>
                    <span class="score">${Number(m.score1)} - ${Number(m.score2)}</span>
                    <span class="equipe ${m.score2 > m.score1 ? 'gagnant' : ''}">${escapeHtml(m.team2_nom)}</span>
                    <span class="poule-tag">Poule ${escapeHtml(m.poule)}</span>
                </div>`).join('') + '</div>';
        }
        
        function renderLigue(data, matchs) {
            const unique = data.poules.length === 1;
            let html = `<h2 class="ligue-title">Ligue ${data.ligue_num}</h2>`;
            html += '<div class="poules-grid">';
            for (const poule of data.poules) {
                html += '<div class="poule">';
                html += `<div class="poule-title">${unique ? 'Poule Unique' : 'Poule ' + escapeHtml(poule.nom)}</div>`;
                html += '<ul class="leaderboard">';
                html += poule.teams.map(renderItem).join('');
                html += '</ul></div>';
            }
            html += '</div>';
            html += renderResultats(matchs);
            document.getElementById('ligue-content').innerHTML = html;
        }

        async function loadLigue(ligue) {
            const requete = ++derniereRequete;
            const [{ ok, data }, resMatchs] = await Promise.all([
                api('/api/ligue?ligue_num=' + encodeURIComponent(ligue)),
                api('/api/matchs?limit=10&ligue_num=' + encodeURIComponent(ligue))
            ]);
            // Si l'utilisateur a changé de ligue entre-temps, on ignore cette réponse
            if (requete !== derniereRequete) return;
            if (!ok || !Array.isArray(data.poules)) {
                document.getElementById('ligue-content').innerHTML =
                    `<p class="ligue-message">${escapeHtml(data.error || 'Impossible de charger la ligue')}</p>`;
                return;
            }
            renderLigue(data, resMatchs.ok && Array.isArray(resMatchs.data) ? resMatchs.data : []);
        }

        document.addEventListener('click', (e) => {
            const selector = document.querySelector('.selector-wrapper');
            if (!selector.contains(e.target)) {
                closeDropdown();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDropdown();
        });

        loadLigue(currentLigue);
    </script>
</body>
</html>
