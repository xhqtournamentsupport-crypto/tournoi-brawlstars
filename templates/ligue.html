<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligue - XHQ Tournament</title>
    {% include '_head.html' %}
    <style>
        .header-nav h1 small { display: block; }

        .selector-wrapper { position: relative; z-index: 100; width: fit-content; margin-bottom: 2rem; }
        .selector-btn { padding: 0.7rem 1.2rem 0.7rem 1.3rem; font-size: 1.2rem; }
        .dropdown-arrow { font-size: 0.75rem; transition: transform 0.15s; }
        .dropdown-arrow.open { transform: rotate(180deg); }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 1001;
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            min-width: 260px;
            padding: 6px;
            background: var(--panel-2);
            border: 1px solid var(--line-2);
            border-radius: 6px;
        }

        .dropdown-menu.open { display: grid; }

        .dropdown-item {
            padding: 0.6rem 0.8rem;
            border: 0;
            border-radius: 3px;
            background: transparent;
            color: var(--text);
            font-family: var(--display);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-item:hover { background: var(--line); }
        .dropdown-item.active { background: var(--accent); color: var(--ink); }

        .ligue-section { position: relative; z-index: 1; }

        .ligue-title { font-size: 2.4rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.4rem; }

        .saison-bandeau {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .saison-tag { color: var(--accent); font-family: var(--display); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
        .palmares strong { color: var(--gold); font-weight: 600; }

        .poules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr));
            gap: 1.5rem;
        }

        .poule { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0 0.6rem; }

        .poule-title {
            display: flex;
            justify-content: space-between;
            padding: 0.9rem 1.2rem 0.7rem;
            font-family: var(--display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--line);
        }

        .leaderboard { list-style: none; margin: 0; padding: 0; }

        .leaderboard-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid var(--line);
        }

        .leaderboard-item:last-child { border-bottom: 0; }
        .leaderboard-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
        .leaderboard-item.monte::before { background: var(--win); }
        .leaderboard-item.descend::before { background: var(--lose); }
        .leaderboard-item.champion::before { background: var(--gold); }
        .leaderboard-item:hover { background: rgba(255, 255, 255, 0.02); }

        .rank {
            width: 2.2rem;
            font-family: var(--display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .rank.top1 { color: var(--gold); }
        .rank.top2, .rank.top3 { color: var(--text); }

        .player-info { flex: 1; min-width: 0; }
        .player-name { font-weight: 600; overflow-wrap: anywhere; }
        .player-stats { margin-top: 0.1rem; color: var(--dim); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

        .player-points {
            min-width: 4.5rem;
            text-align: right;
            font-family: var(--display);
            font-size: 1.3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .leaderboard-item.vide .player-name, .leaderboard-item.vide .player-points, .leaderboard-item.vide .rank { color: #3a3f49; }

        .badge {
            min-width: 4.8rem;
            text-align: center;
            font-family: var(--display);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .badge.monte { color: var(--win); }
        .badge.descend { color: var(--lose); }
        .badge.champion { color: var(--gold); }

        .resultats { margin-top: 2.5rem; }
        .resultats h3 { font-size: 1.4rem; text-transform: uppercase; margin-bottom: 1rem; }

        .resultat {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.2rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-bottom-width: 0;
        }

        .resultat:first-of-type { border-radius: 6px 6px 0 0; }
        .resultat:last-child { border-bottom-width: 1px; border-radius: 0 0 6px 6px; }
        .resultat .equipe { font-weight: 600; overflow-wrap: anywhere; }
        .resultat .equipe:first-child { text-align: right; }
        .resultat .equipe.gagnant { color: var(--win); }
        .resultat .score { font-size: 1.25rem; }
        .resultat .poule-tag { color: var(--dim); font-size: 0.8rem; white-space: nowrap; }

        @media (max-width: 600px) {
            .leaderboard-item { padding: 0.65rem 0.9rem; gap: 0.6rem; }
            .badge { min-width: 0; }
            .resultat { grid-template-columns: 1fr auto 1fr; }
            .resultat .poule-tag { grid-column: 1 / -1; text-align: center; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <main class="xhq-main">
    <div class="container">
        <div class="header-nav">
            <h1><span class="kicker">Classement</span>Ligues</h1>
            <a href="/">← Retour à l'accueil</a>
        </div>

        <div class="selector-wrapper">
            <button class="selector-btn" type="button" onclick="toggleDropdown()" aria-haspopup="true">
                <span id="selector-label">Ligue 1</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu" id="dropdown-menu">
                {% for n in range(1, 11) %}
                <button class="dropdown-item{% if n == 1 %} active{% endif %}" type="button" data-ligue="{{ n }}" onclick="selectLigue({{ n }})">Ligue {{ n }}</button>
                {% endfor %}
            </div>
        </div>

        <div class="ligue-section" id="ligue-content">
            <p class="ligue-message">Chargement du classement…</p>
        </div>
    </div>
    </main>
    {% include '_footer.html' %}

    <script>
        const BADGES = {
            champion: '<span class="badge champion">Champion</span>',
            monte: '<span class="badge monte">Monte</span>',
            descend: '<span class="badge descend">Descend</span>'
        };

        let currentLigue = 1;
        let derniereRequete = 0;

        function toggleDropdown() {
            document.getElementById('dropdown-menu').classList.toggle('open');
            document.querySelector('.dropdown-arrow').classList.toggle('open');
        }

        function closeDropdown() {
            document.getElementById('dropdown-menu').classList.remove('open');
            document.querySelector('.dropdown-arrow').classList.remove('open');
        }

        function selectLigue(ligue) {
            currentLigue = ligue;
            closeDropdown();
            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.classList.toggle('active', Number(item.dataset.ligue) === ligue);
            });
            document.getElementById('selector-label').textContent = 'Ligue ' + ligue;
            loadLigue(ligue);
        }

        function renderItem(place) {
            const rang = place.rang;
            let rankClass = '';
            if (rang === 1) rankClass = 'top1';
            else if (rang === 2) rankClass = 'top2';
            else if (rang === 3) rankClass = 'top3';

            const vide = !place.team_id;
            const statut = vide ? '' : (place.statut || '');
            const nom = vide ? 'XXXXX' : escapeHtml(place.team_name);

            return `
                <li class="leaderboard-item ${statut} ${vide ? 'vide' : ''}">
                    <span class="rank ${rankClass}">#${rang}</span>
                    <div class="player-info">
                        <div class="player-name">${nom}</div>
                        ${vide ? '' : `<div class="player-stats">J ${place.joues} · V ${place.victoires} · D ${place.defaites} · ${place.diff > 0 ? '+' : ''}${place.diff}</div>`}
                    </div>
                    <div class="player-points">${vide ? 0 : Number(place.points) || 0} pts</div>
                    ${BADGES[statut] || ''}
                </li>
            `;
        }

        // N'affiche QUE les teams renvoyées par l'API pour cette ligue
        function renderResultats(matchs) {
            if (!matchs.length) {
                return '<div class="resultats"><h3>Derniers résultats</h3><p class="ligue-message">Aucun match joué dans cette ligue pour le moment</p></div>';
            }
            return '<div class="resultats"><h3>Derniers résultats</h3>' + matchs.map(m => `
                <div class="resultat">
                    <span class="equipe ${m.score1 > m.score2 ? 'gagnant' : ''}">${escapeHtml(m.team1_nom)}</span>
                    <span class="score">${Number(m.score1)} - ${Number(m.score2)}</span>
                    <span class="equipe ${m.score2 > m.score1 ? 'gagnant' : ''}">${escapeHtml(m.team2_nom)}</span>
                    <span class="poule-tag">Poule ${escapeHtml(m.poule)}</span>
                </div>`).join('') + '</div>';
        }
        
        function renderLigue(data, matchs) {
            const unique = data.poules.length === 1;
            let html = `<h2 class="ligue-title">Ligue ${data.ligue_num}</h2>`;
            const palmares = (data.palmares || []).filter(p => p.champion);
            html += `<div class="saison-bandeau">
                <span class="saison-tag">Saison ${Number(data.saison) || 1} en cours</span>
                ${palmares.length ? `<span class="palmares">Derniers champions : ${palmares.map(p => `S${Number(p.numero)} <strong>${escapeHtml(p.champion)}</strong>`).join(' · ')}</span>` : ''}
            </div>`;
            html += '<div class="poules-grid">';
            for (const poule of data.poules) {
                html += '<div class="poule">';
                html += `<div class="poule-title">${unique ? 'Poule Unique' : 'Poule ' + escapeHtml(poule.nom)}</div>`;
                html += '<ul class="leaderboard">';
                html += poule.teams.map(renderItem).join('');
                html += '</ul></div>';
            }
            html += '</div>';
            html += renderResultats(matchs);
            document.getElementById('ligue-content').innerHTML = html;
        }

        async function loadLigue(ligue) {
            const requete = ++derniereRequete;
            const [{ ok, data }, resMatchs] = await Promise.all([
                api('/api/ligue?ligue_num=' + encodeURIComponent(ligue)),
                api('/api/matchs?limit=10&ligue_num=' + encodeURIComponent(ligue))
            ]);
            // Si l'utilisateur a changé de ligue entre-temps, on ignore cette réponse
            if (requete !== derniereRequete) return;
            if (!ok || !Array.isArray(data.poules)) {
                document.getElementById('ligue-content').innerHTML =
                    `<p class="ligue-message">${escapeHtml(data.error || 'Impossible de charger la ligue')}</p>`;
                return;
            }
            renderLigue(data, resMatchs.ok && Array.isArray(resMatchs.data) ? resMatchs.data : []);
        }

        document.addEventListener('click', (e) => {
            const selector = document.querySelector('.selector-wrapper');
            if (!selector.contains(e.target)) {
                closeDropdown();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDropdown();
        });

        loadLigue(currentLigue);
    </script>
</body>
</html>
